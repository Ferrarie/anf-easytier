# ANFAGENT-30 测试栈（避免与 VM 上官方 easytier@default 的 11010 冲突）
# 用法：cp .env.example .env && docker compose -f compose.anf.yaml up -d
services:
  easytier-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: anf-easytier-web
    restart: unless-stopped
    ports:
      - "11211:11211"
      - "22020:22020/udp"
    volumes:
      - web-data:/app/data
    command:
      - --db
      - /app/data/et.db
      - --config-server-port
      - "22020"
      - --api-server-port
      - "11211"
      - --anf-network-name
      - ${ANF_NETWORK_NAME:-anf-m3}
      - --anf-network-secret
      - ${ANF_NETWORK_SECRET:-}
      - --anf-center-peer-url
      - ${ANF_CENTER_PEER_URL:-}

  # 中心 core（中继/兜底），测试阶段用 11110 避开官方 core 的 11010
  anf-easytier-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: anf-easytier-core
    restart: unless-stopped
    network_mode: host
    command:
      - --network-name
      - anf-m3
      - --listeners
      - tcp://0.0.0.0:11110
      - udp://0.0.0.0:11110
      - --network-secret
      - ${ANF_NETWORK_SECRET:-}

volumes:
  web-data:
