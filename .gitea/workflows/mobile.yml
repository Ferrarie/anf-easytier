# ANFAGENT-30 移动端 APK 构建（gitea actions）——对照 .github/workflows/mobile.yml
# 触发方式参考 Anidev/inventory-view/.gitea/workflows/image-build.yml：v* 标签自动构建，可手动 dispatch
name: mobile-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: https://github.com/actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '21'

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v3
        with:
          # 12.0 对应的下载 URL 已 404，改用实际构建号 12266719
          cmdline-tools-version: 12266719
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34'

      - name: Setup Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup protoc
        # Maven Central 取 protoc 4.35.1（= protobuf v35.1）；GitHub release 附件在 runner 上 TLS 不稳定
        # protobuf-java jar 内含 google/protobuf well-known types，解压到 /usr/local/include 供 protoc 隐式查找
        run: |
          curl -fsSL -o /usr/local/bin/protoc https://repo1.maven.org/maven2/com/google/protobuf/protoc/4.35.1/protoc-4.35.1-linux-x86_64.exe
          chmod +x /usr/local/bin/protoc
          curl -fsSL -o /tmp/protobuf-java.jar https://repo1.maven.org/maven2/com/google/protobuf/protobuf-java/4.35.1/protobuf-java-4.35.1.jar
          mkdir -p /usr/local/include
          cd /usr/local/include
          jar xf /tmp/protobuf-java.jar google/protobuf
          rm -f /tmp/protobuf-java.jar
          protoc --version

      - name: Set Android environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> "$GITHUB_ENV"

      - name: Build frontend lib
        run: pnpm --dir easytier-web/frontend-lib build

      - name: Build VPN service API
        # tauri-plugin-vpnservice-api 的 types/main 指向 dist-js（rollup 产物，未提交），需先构建供 vue-tsc 解析
        run: pnpm --dir tauri-plugin-vpnservice build

      - name: Build APK
        run: |
          cd easytier-gui
          pnpm tauri android build --apk --split-per-abi

      - name: Upload APK artifacts
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: anf-easytier-apk
          path: |
            easytier-gui/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
