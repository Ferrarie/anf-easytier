# ANFAGENT-30 CI（gitea actions）——runner 已确认可用（gitea-runner-1）
name: ci

on:
  push:
    branches: [main, codex/*]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: 安装 Rust 工具链
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          components: rustfmt, clippy
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试
        run: cargo test --workspace

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: 安装 Rust 工具链
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
      - name: 构建 linux x86_64 二进制
        run: |
          cargo build --release -p easytier -p easytier-web
      - name: 上传产物
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: anf-easytier-linux-x86_64
          path: |
            target/release/anf-easytier-core
            target/release/easytier-web

